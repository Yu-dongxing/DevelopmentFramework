server:
  port: 8080
  forward-headers-strategy: framework
  # Tomcat 虚拟线程配置（如果在 WebFlux 下该配置不生效，如果在传统 Web 下生效）
  tomcat:
    # 最大连接数：Tomcat 允许接收和处理的最大并发连接数 (默认 8192，高并发场景可适当调大)
    max-connections: 10000
    # 接受队列长度：当所有处理线程都在忙时，允许在队列中排队的请求数 (默认 100，高并发极易溢出导致 Connection Refused)
    accept-count: 1000
    # 连接超时时间：降低此值可以快速释放被恶意或慢速客户端占用的连接 (默认 20000ms，改为 5000ms)
    connection-timeout: 5000ms
    # 保持连接 (Keep-Alive) 的最大请求数，复用 TCP 连接提升性能
    max-keep-alive-requests: 500
    threads:
      # 注意：开启虚拟线程后，此处的 max-threads 实际上对请求处理线程池不再起核心限制作用，
      # 因为 Spring Boot 会使用无界的虚拟线程执行器来处理请求。
      max: 200

spring:
  servlet:
    multipart:
      # 网关和存储上限需同步设置；请求上限额外预留表单开销。
      max-file-size: ${FILE_MAX_FILE_SIZE:100MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:110MB}
  application:
    name: springbootDev

  # =========================================================
  # Java 21 虚拟线程
  # 开启后，Web请求、定时任务等将默认使用轻量级的虚拟线程，极大提升并发性能
  # =========================================================
  threads:
    virtual:
      enabled: true

  # =========================================================
  # 数据库连接配置 (MySQL)
  # =========================================================
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    # JDBC 参数说明
    # 1. serverTimezone=Asia/Shanghai：确保时区正确
    # 2. rewriteBatchedStatements=true：开启批量插入/更新优化 (MyBatis-Plus saveBatch 必备)
    # 3. cachePrepStmts=true & prepStmtCacheSize=250 & prepStmtCacheSqlLimit=2048：开启预编译语句缓存，极大提升高频重复 SQL 的性能
    # 4. useServerPrepStmts=true：开启服务端预编译
    # 5. createDatabaseIfNotExist=true: 数据库自动建库
    url: ${DB_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:dev}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456789}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      # 最小空闲连接数 (高并发下建议与 maximum-pool-size 保持一致，避免频繁创建和销毁连接带来的性能损耗)
      minimum-idle: 50
      # 最大连接池大小 (默认只有 10。有了虚拟线程后并发极高，如果不调大，大量虚拟线程会阻塞在等待数据库连接上)
      maximum-pool-size: 50
      # 从连接池获取连接的最大等待时间，超时未获取到则抛出异常 (默认 30000ms，高并发下可以适当缩短，快速失败，避免雪崩)
      connection-timeout: 10000
      # 连接在池中的最大空闲时间
      idle-timeout: 600000
      # 连接的最大生命周期 (必须比数据库服务器设置的 wait_timeout 短几秒)
      max-lifetime: 1800000

  # =========================================================
  # Redis 配置
  # =========================================================
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password:
      # 连接 Redis 的超时时间
      timeout: 3000ms
      lettuce:
        pool:
          # 高并发下提高最大活跃连接数
          max-active: 100
          # 连接池耗尽时，获取连接的最大等待时间 (避免线程无限期阻塞)
          max-wait: 2000ms
          # 最大空闲连接数
          max-idle: 50
          # 最小空闲连接数
          min-idle: 10

# =========================================================
# MyBatis-Plus 配置
# =========================================================
mybatis-plus:
  # XML 映射文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类所在包（使用通配符支持多模块扫描）
  type-aliases-package: top.yuxs.springbootdev.modules.**.entity
  configuration:
    # 开启驼峰命名自动映射 (如数据库 user_name 会自动映射到 Java 的 userName)
    map-underscore-to-camel-case: true
    # 打印 SQL 语句到控制台 (生产环境建议关闭)
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 全局逻辑删除字段值 (1: 已删除, 0: 未删除)
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 全局主键生成策略 (ASSIGN_ID 为雪花算法生成唯一 ID)
      id-type: ASSIGN_ID

# =========================================================
# Sa-Token 权限认证配置
# =========================================================
sa-token:
  # Token 的名称 (也是存储到前端 Cookie / Header 中的 key 名称)
  token-name: Authorization
  # Token 的有效期，单位秒 (例如：2592000 代表 30 天，-1 代表永久有效)
  timeout: 2592000
  # Token 临时有效期 (指定时间内无操作就过期，单位秒，-1 代表不限制)
  active-timeout: -1
  # 是否允许同一账号多地登录 (为 true 时允许一起登录, 为 false 时新登录会把旧登录挤下线)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 Token (为 true 时所有登录共用一个 Token, 为 false 时每次登录新建一个 Token)
  is-share: true
  # Token 风格 (例如 UUID, Simple-UUID, Random-String 等)
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # 防火墙配置
  firewall:
    # 是否开启危险字符检查 (默认 true，拦截 %2e, %2f, .. 等)
    check-path-character: true
    # 是否开启目录遍历符检查 (默认 true)
    check-directory-traversal: true
    # 允许的请求方式
    allowed-method: GET, POST, PUT, DELETE

# 自定义业务配置
# =========================================================

# Jackson 配置
jackson:
  # 是否开启 Long 转 String（解决雪花算法 ID 精度丢失问题）
  long-to-string: true

# 数据库初始化配置
db:
  init:
    # 是否开启数据库初始化（自动建表/更新表）
    enabled: true
    # 自动建表/更新表时扫描实体的基础包名
    base-package: top.yuxs.springbootdev.modules
    # 是否初始化默认数据
    init-data: true
    # 可选值：MYSQL、POSTGRESQL、ORACLE、H2。留空时根据 JDBC 自动识别。
    dialect: ${DB_DIALECT:}

# 自定义文件上传配置
file:
  # 必须与 StorageType 枚举完全一致: LOCAL, ALIYUN_OSS, MINIO, RUSTFS
  # 当前启用的文件存储类型；可通过 FILE_STORAGE_ACTIVE 环境变量覆盖。
  active: ${FILE_STORAGE_ACTIVE:LOCAL}

  # RustFS（兼容 S3 协议）对象存储配置。
  rustfs:
    # 切换上传类型后需保留启用状态，以访问和清理历史 RustFS 文件。
    enabled: ${FILE_RUSTFS_ENABLED:false}
    # 后端访问 RustFS S3 服务的地址，必须为不含路径前缀的 HTTP(S) 地址。
    endpoint: ${FILE_RUSTFS_ENDPOINT:}
    # 浏览器可访问的 RustFS 地址；私有文件生成预签名链接时使用，未配置则使用 endpoint。
    public-endpoint: ${FILE_RUSTFS_PUBLIC_ENDPOINT:}
    # S3 签名使用的区域标识；RustFS 默认使用 us-east-1。
    region: ${FILE_RUSTFS_REGION:us-east-1}
    # 存储文件的 RustFS 桶名称。
    bucket-name: ${FILE_RUSTFS_BUCKET:springbootdev}
    # RustFS 访问密钥；请通过环境变量注入，禁止提交真实凭据。
    access-key: ${FILE_RUSTFS_ACCESS_KEY:}
    # RustFS 私有访问密钥；请通过环境变量注入，禁止提交真实凭据。
    secret-key: ${FILE_RUSTFS_SECRET_KEY:}
    # 是否使用路径风格访问（http://endpoint/bucket/object）；RustFS 通常应保持为 true。
    path-style-access: ${FILE_RUSTFS_PATH_STYLE:true}
    # 文件访问方式：PRIVATE 生成限时预签名地址，PUBLIC 返回对象公开地址。
    access-mode: ${FILE_RUSTFS_ACCESS_MODE:PRIVATE}
    # 私有文件预签名下载地址的有效期，单位为秒，取值范围为 1 至 604800。
    presigned-url-expire-seconds: ${FILE_RUSTFS_URL_EXPIRE_SECONDS:900}
    # 是否在上传时自动创建不存在的桶；仅建议在开发环境开启，不会自动设置公开策略。
    auto-create-bucket: ${FILE_RUSTFS_AUTO_CREATE_BUCKET:false}
    # 建立 RustFS 网络连接的最长等待时间。
    connection-timeout: 5s
    # 单次 RustFS 请求尝试的最长等待时间。
    attempt-timeout: 60s
    # 一次 RustFS 调用（含重试）的最长总等待时间。
    call-timeout: 180s
    # RustFS 请求失败后的最大重试次数，取值范围为 0 至 5。
    max-retries: 2
    # 单个上传文件的最大字节数，默认 104857600（100 MiB）。
    max-upload-bytes: ${FILE_RUSTFS_MAX_UPLOAD_BYTES:104857600}

  # 本地磁盘存储配置。
  local:
    # 应用对外访问域名，用于拼接本地文件访问地址。
    domain: http://localhost:8080
    # 文件保存到本地磁盘的根目录。
    upload-path: ./uploads/
    # Spring MVC 映射到本地上传目录的访问路径。
    access-path: /uploads/**
    # 文件访问方式：PUBLIC 返回静态 URL，PRIVATE 返回受登录及归属校验保护的应用地址。
    access-mode: ${FILE_LOCAL_ACCESS_MODE:PUBLIC}

  # 阿里云 OSS 对象存储配置。
  aliyun:
    # OSS 文件的对外访问域名或绑定的 CDN 域名。
    domain: https://cdn.example.com
    # OSS 服务端点，不包含协议前缀。
    endpoint: oss-cn-hangzhou.aliyuncs.com
    # OSS 存储桶名称。
    bucket-name: my-bucket
    # OSS 访问密钥 ID；请通过环境变量或安全配置中心注入。
    access-key: xxxx
    # OSS 访问密钥 Secret；请通过环境变量或安全配置中心注入。
    secret-key: xxxx
    # 文件访问方式：PRIVATE 按文件详情请求即时返回预签名 URL。
    access-mode: ${FILE_ALIYUN_ACCESS_MODE:PUBLIC}
    # 私有预签名下载地址有效期，单位为秒。
    presigned-url-expire-seconds: ${FILE_ALIYUN_URL_EXPIRE_SECONDS:900}

  # MinIO 对象存储配置。
  minio:
    # MinIO 文件的对外访问域名，用于拼接文件访问地址。
    domain: http://localhost:9000
    # MinIO 服务端点，需包含 HTTP(S) 协议与端口。
    endpoint: http://localhost:9000
    # MinIO 存储桶名称。
    bucket-name: springbootdev
    # MinIO 访问密钥；请通过环境变量或安全配置中心注入。
    access-key: minioadmin
    # MinIO 私有访问密钥；请通过环境变量或安全配置中心注入。
    secret-key: minioadmin
    # 文件访问方式：PRIVATE 按文件详情请求即时返回预签名 URL。
    access-mode: ${FILE_MINIO_ACCESS_MODE:PUBLIC}
    # 私有预签名下载地址有效期，单位为秒。
    presigned-url-expire-seconds: ${FILE_MINIO_URL_EXPIRE_SECONDS:900}

# Aegis 业务日志配置
aegis:
  log:
    # 接口日志保留天数，支持 7, 30, 280 等。
    # 设置为 30 表示只保留最近 30 天日志。
    # 设置为 -1 或 0 则代表永不清理（默认配置）
    retention-days: 30

