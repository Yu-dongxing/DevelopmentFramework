spring:
  application:
    name: springbootDev-test

  # 测试环境使用 H2 内存数据库，避免依赖真实 MySQL
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      initialization-fail-timeout: 0

# 禁用 Aegis DB Engine 的自动初始化，防止测试环境因为没有 MySQL 专有元数据表导致报错
db:
  init:
    enabled: false
    init-data: false
